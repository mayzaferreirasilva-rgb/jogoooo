<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Mario Bros - Mini Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #222;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #score-board {
            color: white;
            font-size: 24px;
            margin-bottom: 10px;
            text-shadow: 2px 2px #000;
        }
        canvas {
            background: #5c94fc; /* Azul céu do Mario */
            border: 4px solid #fff;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .controls {
            color: #aaa;
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="score-board">MOEDAS: <span id="score">0</span></div>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <div class="controls">Use as setas <b>Esquerda / Direita</b> para andar e <b>Seta para Cima / Espaço</b> para pular.</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");

        // Configurações do Jogo
        const gravity = 0.6;
        let score = 0;

        // Player (Mario)
        const player = {
            x: 100,
            y: 200,
            width: 30,
            height: 40,
            velX: 0,
            velY: 0,
            speed: 5,
            jumpForce: 12,
            grounded: false,
            color: "#f83800" // Vermelho Mario
        };

        // Cenário estático e plataformas
        const platforms = [
            // O Chão
            { x: 0, y: 360, width: 800, height: 40, type: 'ground', color: '#e8a040' },
            // Blocos flutuantes
            { x: 250, y: 240, width: 40, height: 40, type: 'block', color: '#b84418' },
            { x: 290, y: 240, width: 40, height: 40, type: 'mystery', color: '#fc9838' },
            { x: 330, y: 240, width: 40, height: 40, type: 'block', color: '#b84418' },
            // Cano Verde
            { x: 550, y: 280, width: 60, height: 80, type: 'pipe', color: '#00a800' }
        ];

        // Moedas coletáveis
        let coins = [
            { x: 260, y: 200, width: 15, height: 20, collected: false },
            { x: 302, y: 150, width: 15, height: 20, collected: false },
            { x: 342, y: 200, width: 15, height: 20, collected: false },
            { x: 572, y: 230, width: 15, height: 20, collected: false }
        ];

        // Controle de teclas
        const keys = {};
        window.addEventListener("keydown", e => keys[e.code] = true);
        window.addEventListener("keyup", e => keys[e.code] = false);

        // Sistema de colisões AABB
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        function update() {
            // Movimentação lateral
            if (keys["ArrowRight"] || keys["KeyD"]) player.velX = player.speed;
            else if (keys["ArrowLeft"] || keys["KeyA"]) player.velX = -player.speed;
            else player.velX = 0;

            // Pulo (apenas se estiver no chão)
            if ((keys["ArrowUp"] || keys["Space"] || keys["KeyW"]) && player.grounded) {
                player.velY = -player.jumpForce;
                player.grounded = false;
            }

            // Aplicar gravidade
            player.velY += gravity;

            // Atualizar posições provisórias
            player.x += player.velX;
            player.y += player.velY;

            // Limites da tela lateral
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            player.grounded = false;

            // Tratar colisão com plataformas e elementos sólidos
            platforms.forEach(platform => {
                if (checkCollision(player, platform)) {
                    // Colisão vinda de cima (pousar)
                    if (player.velY > 0 && (player.y + player.height - player.velY) <= platform.y) {
                        player.y = platform.y - player.height;
                        player.velY = 0;
                        player.grounded = true;
                    }
                    // Colisão vinda de baixo (bater a cabeça)
                    else if (player.velY < 0 && (player.y - player.velY) >= platform.y + platform.height) {
                        player.y = platform.y + platform.height;
                        player.velY = 0;
                    }
                    // Colisão pelas laterais
                    else if (player.velX > 0 && (player.x + player.width - player.velX) <= platform.x) {
                        player.x = platform.x - player.width;
                    }
                    else if (player.velX < 0 && (player.x - player.velX) >= platform.x + platform.width) {
                        player.x = platform.x + platform.width;
                    }
                }
            });

            // Verificar coleta de moedas
            coins.forEach(coin => {
                if (!coin.collected && checkCollision(player, coin)) {
                    coin.collected = true;
                    score += 1;
                    scoreElement.innerText = score;
                }
            });
        }

        function draw() {
            // Limpar tela
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Desenhar nuvens decorativas ao fundo
            ctx.fillStyle = "rgba(255, 255, 255, 0.5)";
            ctx.fillRect(100, 80, 80, 30);
            ctx.fillRect(500, 60, 120, 40);

            // Desenhar plataformas e blocos do cenário
            platforms.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.width, p.height);
                ctx.strokeStyle = "#000";
                ctx.lineWidth = 3;
                ctx.strokeRect(p.x, p.y, p.width, p.height);

                // Detalhes extras de textura estilo Mario Retro
                if (p.type === 'ground') {
                    ctx.fillStyle = "#b84418";
                    for(let i = p.x; i < p.width; i+=20) {
                        ctx.fillRect(i, p.y + 10, 10, 10);
                    }
                }
                if (p.type === 'mystery') {
                    ctx.fillStyle = "#000";
                    ctx.font = "bold 25px Arial";
                    ctx.fillText("?", p.x + 12, p.y + 28);
                }
            });

            // Desenhar moedas flutuantes (ovais amarelas)
            coins.forEach(c => {
                if (!c.collected) {
                    ctx.fillStyle = "#fcc018";
                    ctx.beginPath();
                    ctx.ellipse(c.x + c.width/2, c.y + c.height/2, c.width/2, c.height/2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = "#000";
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            });

            // Desenhar o Jogador (Mario)
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);
            
            // Macacão azul do Mario
            ctx.fillStyle = "#0020c2";
            ctx.fillRect(player.x + 4, player.y + 20, player.width - 8, player.height - 20);
            
            // Boné do Mario
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, 10);

            // Contorno do personagem
            ctx.strokeStyle = "#000";
            ctx.lineWidth = 2;
            ctx.strokeRect(player.x, player.y, player.width, player.height);
        }

        // Loop principal do Jogo
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Iniciar loop
        gameLoop();
    </script>
</body>
</html>
